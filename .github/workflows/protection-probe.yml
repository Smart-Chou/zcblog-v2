name: Protection Probe
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Probe push to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "--- 探针 1: GITHUB_TOKEN 能否直推 main"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: probe push (auto-revert)"
          if git push 2>&1 | tail -3; then echo "RESULT_PUSH=OK"; else echo "RESULT_PUSH=DENIED"; fi
