name: CI

on:
    push:
        branches: [main, theme]
    pull_request:
        branches: [main, theme]
    # S4：允许手动跑一次完整门禁（不部署），用于验收留证
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "24"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm run lint

            - name: Run TypeScript check
              run: pnpm type-check

            - name: Run unit tests
              run: pnpm test:unit

            # M1-5：DESIGN.md §5.6.13 P1–P10 + 12 个 atom 的落地检查（A1–A8）。
            # M1-6：12 份 atom 文档（D1–D7；D8 需要 dist，在 gates job 里跑）。
            # 纯 node + 仓库内文件，不需要构建、不需要浏览器；本地命令与 CI 完全相同。
            - name: Atom / token gates (§5.6.13)
              run: |
                  node scripts/gates/verify-atoms.mjs
                  node scripts/gates/verify-atom-docs.mjs

            # M2-1：P9 的分母（组件清单）+ R-40 文档漂移。纯 node + 仓库内文件，不需要构建。
            - name: Inventory / doc drift gates (R-40)
              run: |
                  node scripts/gates/verify-component-inventory.mjs
                  node scripts/gates/verify-doc-drift.mjs

    # ---- 视觉门禁：/design/atoms 72 张像素基线（Linux）----
    # 与 test/gates 平行跑。三条硬约束：
    #  1. 镜像 tag 必须与 package.json 的 @playwright/test 版本一致（1.63.0），
    #     镜像里的浏览器构建号跟版本绑定，跨版本截图不可比。
    #  2. 基线 e2e/__screenshots__/design-atoms-linux/ 就是在**这个镜像**里生成的
    #     （`--update-snapshots`），所以判定用 maxDiffPixels: 0，不放大阈值。
    #  3. 不带 --update-snapshots、--retries=0：72/72 必须是第一次就过，
    #     连跑两遍才算稳定；重试会把 flake 藏起来。
    visual:
        name: visual (design/atoms · linux baselines)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        container:
            image: mcr.microsoft.com/playwright:v1.63.0-noble
            options: --ipc=host
        env:
            # 显式钉平台：基线目录与阈值由 project 决定（见 playwright.config.ts）
            PLAYWRIGHT_BASELINE_PLATFORM: linux

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Enable pnpm (corepack)
              run: corepack enable

            - name: Install dependencies
              run: corepack pnpm install --frozen-lockfile

            # 只构建，不跑 fetch:all：/design/atoms 不依赖内容仓，视觉门禁不该被
            # 第三方 API 抖动拖红（内容相关的断言在 gates job 里）。
            - name: Build (astro preview output)
              run: corepack pnpm exec astro build

            # M2-1 / R-41：12 份 atom 文档页 + /design/atoms 的 a11y 与结构门禁。
            # 之前只在本地跑；M2-1 起进 CI，未接线不算完成。
            - name: Docs a11y · atom docs + atoms (R-41)
              run: |
                  corepack pnpm exec playwright test e2e/design-atom-docs.a11y.spec.ts e2e/design-atoms.a11y.spec.ts --reporter=list --retries=0
                  echo "Docs a11y · atom docs 36 passed + atoms 12 passed"

            - name: Visual regression · pass 1/2
              run: corepack pnpm exec playwright test e2e/design-atoms.visual.spec.ts --reporter=list --retries=0

            - name: Visual regression · pass 2/2 (stability)
              run: corepack pnpm exec playwright test e2e/design-atoms.visual.spec.ts --reporter=list --retries=0

            - name: Upload visual diff on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: visual-diff
                  path: |
                      test-results/
                      playwright-report/
                  retention-days: 7
                  if-no-files-found: ignore

    # ---- S4 门禁：构建断言 + 内容检查 + 性能预算 ----
    # 和 deploy.yml 的 Build 段保持同一套 env；这里**不部署**，只验门槛。
    gates:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout zcblog
              uses: actions/checkout@v5

            - name: Checkout articles (private)
              uses: actions/checkout@v5
              with:
                  repository: Smart-Chou/zcblog-articles
                  path: _articles
                  token: ${{ secrets.ARTICLES_PAT }}

            - name: Copy articles and images
              run: |
                  mkdir -p src/content/article src/assets
                  cp _articles/*.md src/content/article/ 2>/dev/null || true
                  cp _articles/*.mdx src/content/article/ 2>/dev/null || true
                  cp -r _articles/assets/* src/assets/ 2>/dev/null || true
                  echo "📄 $(ls src/content/article/*.md src/content/article/*.mdx 2>/dev/null | wc -l) 篇文章"
                  echo "🖼  $(find src/assets -type f 2>/dev/null | wc -l) 张图片"

            - name: Normalize frontmatter (v1 布尔键 → v2 features)
              run: node scripts/normalize-frontmatter.mjs src/content/article

            - name: Set expected counts from content
              run: |
                  content=$(ls src/content/article/*.md src/content/article/*.mdx 2>/dev/null | wc -l | tr -d ' ')
                  drafts=$(grep -l '^draft: *true' src/content/article/*.md 2>/dev/null | wc -l | tr -d ' ')
                  echo "内容 ${content} 篇，draft ${drafts} 篇 → 期望产出 $((content - drafts)) 篇"
                  echo "EXPECT_CONTENT=$content" >> "$GITHUB_ENV"
                  echo "EXPECT_ARTICLES=$((content - drafts))" >> "$GITHUB_ENV"

            - name: Install system dependencies
              run: sudo apt-get update && sudo apt-get install -y libvips-dev

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              env:
                  CI: true
                  ARTICLE_REPO_PATH: _articles
                  BLINKO_API_URL: https://memos.marxchou.com
                  BLINKO_API_TOKEN: ${{ secrets.BLINKO_API_TOKEN }}
                  UMAMI_API_URL: https://umami.marxchou.com
                  UMAMI_WEBSITE_ID: 73b29141-fccf-4d54-9c2f-f7d0d146f86b
                  UMAMI_USERNAME: ${{ secrets.UMAMI_USERNAME }}
                  UMAMI_PASSWORD: ${{ secrets.UMAMI_PASSWORD }}
                  UMAMI_SHARE_SLUG: EIlCDPZqKiANCpuO
                  BANGUMI_USER_ID: "1246668"
                  DOUBAN_USER_ID: ${{ secrets.DOUBAN_USER_ID }}
                  ENCRYPTION_PASSWORD: ${{ secrets.ENCRYPTION_PASSWORD }}
                  FOREVERBLOG_RSS_URL: ${{ secrets.FOREVERBLOG_RSS_URL }}
                  BUILD_CONCURRENCY: 1
              run: pnpm run build

            - name: Verify build (A1 / A11 / A13 + pagefind)
              run: node scripts/verify-build.mjs

            # M1-6：文档页的构建产物检查（D8：7 个 section + 无空表）
            - name: Atom docs gate (dist)
              run: node scripts/gates/verify-atom-docs.mjs --dist

            - name: Content checks (A2 遗留字段 / A3 相对图)
              run: |
                  python3 scripts/gates/check-legacy-keys.py src/content/article
                  python3 scripts/gates/check-relative-assets.py src/content/article --verify . --expect 22

            - name: Performance budget (A6)
              run: python3 scripts/gates/perf-budget.py dist
