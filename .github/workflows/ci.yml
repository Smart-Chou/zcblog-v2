name: CI

on:
    push:
        branches: [main, theme]
    pull_request:
        branches: [main, theme]
    # S4：允许手动跑一次完整门禁（不部署），用于验收留证
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "24"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm run lint

            - name: Run TypeScript check
              run: pnpm type-check

            - name: Run unit tests
              run: pnpm test:unit

            # M1-5：DESIGN.md §5.6.13 P1–P10 + 12 个 atom 的落地检查（A1–A8）。
            # M1-6：12 份 atom 文档（D1–D7；D8 需要 dist，在 gates job 里跑）。
            # 纯 node + 仓库内文件，不需要构建、不需要浏览器；本地命令与 CI 完全相同。
            - name: Atom / token gates (§5.6.13)
              run: |
                  node scripts/gates/verify-atoms.mjs
                  node scripts/gates/verify-atom-docs.mjs

            # M2-1：P9 的分母（组件清单）+ R-40 文档漂移。纯 node + 仓库内文件，不需要构建。
            - name: Inventory / doc drift gates (R-40)
              run: |
                  node scripts/gates/verify-component-inventory.mjs
                  node scripts/gates/verify-doc-drift.mjs

    # ---- 契约门禁：token / 表面棘轮 / C 层实体（源码级，不读 dist、不碰内容仓）----
    # 单独成 job 而不是塞进 test：这三条是数据/Tokens 契约，红要能一眼归因；
    # 也不该被 lint 之类的格式漂移挡住（格式债在 test 里单独算）。
    # 三条命令与本地 `pnpm gates:tokens|gates:surfaces|gates:entities` 完全同源。
    contract:
        name: contract (tokens · surfaces · entities)
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "24"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # M1-2：token 契约（G-T1…G-S6，生成物逐字节比对）
            - name: Token contract gates (§3.12)
              run: node scripts/gates/check-tokens.mjs

            # M2-1：P5 表面 token 棘轮（页面新增 = 0 / 组件只减不增）
            - name: Surface token ratchet (P5)
              run: node scripts/gates/verify-surface-tokens.mjs

            # M3-1：包边界（W0 + B1–B4）。判据与三条修复路径见 docs/package-boundary.md。
            # 纯 node + 仓库内文件；packages/ 空壳今天必须 packages=3 violations=0。
            - name: Package boundary gates (M3-1 · B1–B4)
              run: node scripts/gates/verify-package-boundary.mjs

            # M2-7a：C 层实体契约（E1–E8）。依赖 src/types/entities.ts 的 ESM 转译，不读 dist；
            # dropped > 0 即 FAIL（运行时宽容、CI 严格，同一份校验器）。
            # --json 把 SUMMARY {...} 打在最后一行，grep 出来归档到 step summary。
            - name: Entity contract gates (E1–E8)
              run: |
                  set -o pipefail
                  node scripts/gates/verify-entities.mjs --json | tee "$RUNNER_TEMP/entities-gate.json"
                  grep '^SUMMARY ' "$RUNNER_TEMP/entities-gate.json" >> "$GITHUB_STEP_SUMMARY" || true

            - name: Upload entity gate report on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: entities-gate-report
                  path: ${{ runner.temp }}/entities-gate.json
                  retention-days: 7
                  if-no-files-found: ignore

            # ---- 下面两条此前在 CI 里**完全不存在**（2026-11-15 补）----
            #
            # 症状来源：`pnpm gates:all` 是 `&&` 链，本地跑到 verify-overlay.mjs
            # 因 2 个 licenses 文件未分类 FAIL 就短路，后面的 verify-icon-sprite
            # 从未执行；而 CI 的 gates job 是手写步骤列表，本来就没写这两条。
            # 结果：S1–S8 那 9 项检查在**两条路径上都是空的**。
            #
            # 危害：icon-markup.ts:52 遇到未登记图标直接 return ""，页面静默少一个
            # 图标，构建 / 门禁 / e2e 全绿。tabler:category 就这样在 skills 页缺过
            # 一整版。S8 正是为此写的。
            #
            # 注意：verify-overlay.mjs 当前有 2 项 FAIL（docs/licenses/* 未登记分类）。
            # 用 continue-on-error 单独放行，让它的红可见但不阻断其他门禁 ——
            # 而不是继续靠 `&&` 短路把它后面的一切一起吞掉。
            - name: Overlay structure gates (non-blocking, 2 known FAIL)
              continue-on-error: true
              run: node scripts/gates/verify-overlay.mjs

            # 这条是硬门禁：图标 sprite / 清单 / 源码引用三方一致，且与 @iconify-json 一致。
            - name: Icon sprite + freshness gates (S1–S8 + icons:check)
              run: |
                  node scripts/gates/verify-icon-sprite.mjs
                  node scripts/generate-icons.js --check

    # ---- 视觉门禁：/design/atoms 72 张 + 页面级 42 张像素基线（Linux）----
    # 与 test/gates 平行跑。四条硬约束：
    #  1. 镜像 tag 必须与 package.json 的 @playwright/test 版本一致（1.63.0），
    #     镜像里的浏览器构建号跟版本绑定，跨版本截图不可比。
    #  2. 基线 e2e/__screenshots__/design-atoms-linux/ 与 pages-linux/ 就是在**这个镜像**里
    #     生成的（`--update-snapshots`），所以判定用 maxDiffPixels: 0，不放大阈值。
    #  3. 不带 --update-snapshots、--retries=0：必须是第一次就过，连跑两遍才算稳定；
    #     重试会把 flake 藏起来。
    #  4. 页面级基线跑在固定内容上（scripts/visual/build-pages-baseline.mjs）：内容仓加一篇
    #     文章不该让视觉门禁红。因此这里**不** checkout 私有文章仓，构建命令也换成该脚本。
    visual:
        # 四套分账，不合并成一个数字：任一套整体跳过时，合并计数仍然是绿的。
        name: visual (atoms 72 + pages 42 + states 36 + player 12 · + pages-radio e2e · linux)
        runs-on: ubuntu-latest
        timeout-minutes: 35
        container:
            image: mcr.microsoft.com/playwright:v1.63.0-noble
            options: --ipc=host
        env:
            # 显式钉平台：基线目录与阈值由 project 决定（见 playwright.config.ts）
            PLAYWRIGHT_BASELINE_PLATFORM: linux

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Enable pnpm (corepack)
              run: corepack enable

            - name: Install dependencies
              run: corepack pnpm install --frozen-lockfile

            # 容器镜像只是提供系统依赖（字体、库），浏览器本身必须按 lockfile 里的
            # playwright 版本现装。镜像 tag 写死 v1.63.0，而 dependabot 会把
            # @playwright/test 升到 1.65+：那时镜像里的 chromium_headless_shell-1254
            # 不存在，12 个 atom docs 用例会在 browserType.launch 就全挂
            # （报 "Executable doesn't exist at /ms-playwright/chromium_headless_shell-1254/..."）。
            # a11y-pr.yml / a11y-nightly.yml 早就这么做，只有这里漏了。
            - name: Install Playwright browsers (版本跟随 lockfile，不依赖镜像 tag)
              run: corepack pnpm exec playwright install --with-deps chromium

            # 只构建，不跑 fetch:all：视觉门禁不该被第三方 API 抖动拖红
            # （内容相关的断言在 gates job 里）。文章内容用 e2e/fixtures/pages-visual/
            # 的固定副本，保证首页/归档/文章页在两次运行与两平台之间逐像素一致。
            - name: Build (fixed fixture content · astro preview output)
              run: node scripts/visual/build-pages-baseline.mjs

            # M2-1 / R-41：12 份 atom 文档页 + /design/atoms 的 a11y 与结构门禁。
            # 之前只在本地跑；M2-1 起进 CI，M5-7a 补上「用例数」硬断言：
            # Playwright 对 skip 的用例仍然返回 0，只跑 3 条也会“绿”。所以不看退出码看条数：
            # docs 12 slug × 3 组（structure / axe light+dark / 390px）= 36，atoms 12 → 合计 48。
            # 实测：runner 上 docs 36 条约 12s，本 step 合计约 14s（旧 run 42246582062 证据）。
            - name: Docs a11y · atom docs + atoms (R-41)
              # 容器任务的默认 shell 是 `sh -e`（dash），不认 `set -o pipefail`；
              # 显式用 bash，否则这条 step 在启动第一行就 exit 2。
              shell: bash
              run: |
                  set -o pipefail
                  corepack pnpm exec playwright test \
                    e2e/design-atom-docs.a11y.spec.ts e2e/design-atoms.a11y.spec.ts \
                    --reporter=list --retries=0 | tee "$RUNNER_TEMP/docs-a11y.log"
                  if ! grep -qE "^ +48 passed" "$RUNNER_TEMP/docs-a11y.log"; then
                    echo "::error::docs a11y 用例数不是 48（docs 36 + atoms 12）——被 skip 也算绿，必须看条数"
                    tail -30 "$RUNNER_TEMP/docs-a11y.log"
                    exit 1
                  fi

            - name: Visual regression · atoms 1/2
              run: corepack pnpm exec playwright test e2e/design-atoms.visual.spec.ts --reporter=list --retries=0

            - name: Visual regression · atoms 2/2 (stability)
              run: corepack pnpm exec playwright test e2e/design-atoms.visual.spec.ts --reporter=list --retries=0

            # M5-11 / V-0 建立 6 页；M6-6a 加 /404/ → 7 页 × 3 视口 × 2 主题 = 42。
            # 同上看条数，不信退出码。
            - name: Visual regression · pages 42 (pass 1/2)
              shell: bash
              run: |
                  set -o pipefail
                  corepack pnpm exec playwright test e2e/pages.visual.spec.ts \
                    --reporter=list --retries=0 | tee "$RUNNER_TEMP/pages-visual-1.log"
                  if ! grep -qE "^ +42 passed" "$RUNNER_TEMP/pages-visual-1.log"; then
                    echo "::error::页面级视觉基线用例数不是 42（7 页 × 2 主题 × 3 视口）"
                    tail -40 "$RUNNER_TEMP/pages-visual-1.log"
                    exit 1
                  fi

            - name: Visual regression · pages 42 (pass 2/2 · stability)
              shell: bash
              run: |
                  set -o pipefail
                  corepack pnpm exec playwright test e2e/pages.visual.spec.ts \
                    --reporter=list --retries=0 | tee "$RUNNER_TEMP/pages-visual-2.log"
                  if ! grep -qE "^ +42 passed" "$RUNNER_TEMP/pages-visual-2.log"; then
                    echo "::error::页面级视觉基线第二遍未全绿（不稳定）"
                    tail -40 "$RUNNER_TEMP/pages-visual-2.log"
                    exit 1
                  fi

            # §7.2 状态级基线：/projects/ /devices/ /skills/ 的 empty / error 两态，
            # 3 页 × 2 态 × 2 主题 × 3 视口 = 36。状态 HTML 由
            # scripts/visual/build-state-baseline.mjs 单独构建到 .visual-states/，
            # spec 自己起静态服务（4401+），不读 dist/、不碰上面的 preview ——
            # 所以 PW_SKIP_PREVIEW=1 连 preview 都不起，这一段不依赖前一个 step 的产物。
            - name: Build state variants (3 pages × empty/error · §7.2)
              run: node scripts/visual/build-state-baseline.mjs

            - name: Visual regression · states 36 (pass 1/2)
              shell: bash
              run: |
                  set -o pipefail
                  PW_SKIP_PREVIEW=1 corepack pnpm exec playwright test \
                    e2e/pages-states.visual.spec.ts \
                    --reporter=list --retries=0 | tee "$RUNNER_TEMP/states-visual-1.log"
                  if ! grep -qE "^ +36 passed" "$RUNNER_TEMP/states-visual-1.log"; then
                    echo "::error::状态级视觉基线用例数不是 36（3 页 × 2 态 × 2 主题 × 3 视口）"
                    tail -40 "$RUNNER_TEMP/states-visual-1.log"
                    exit 1
                  fi

            - name: Visual regression · states 36 (pass 2/2 · stability)
              shell: bash
              run: |
                  set -o pipefail
                  PW_SKIP_PREVIEW=1 corepack pnpm exec playwright test \
                    e2e/pages-states.visual.spec.ts \
                    --reporter=list --retries=0 | tee "$RUNNER_TEMP/states-visual-2.log"
                  if ! grep -qE "^ +36 passed" "$RUNNER_TEMP/states-visual-2.log"; then
                    echo "::error::状态级视觉基线第二遍未全绿（不稳定）"
                    tail -40 "$RUNNER_TEMP/states-visual-2.log"
                    exit 1
                  fi

            - name: Upload visual diff on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: visual-diff
                  path: |
                      test-results/
                      playwright-report/
                  retention-days: 7
                  if-no-files-found: ignore

            # M8-4 / §5.7.1：站级播放器（SitePlayer）的确定性断言。
            # 之前只在本地跑过（D-0172 登记的覆盖缺口），任何对 SitePlayer.astro /
            # site-player.ts / BaseLayout.astro 的改动都不会让门禁变红。
            #
            # 放在 visual job 而不是 test：本 spec 需要真实页面（`astro preview`，
            # playwright.config 的 webServer），而 test job 不 build。visual job 的
            # preview 由上面 step 的 fixture 构建产出，这里**不再起第二个** ——
            # 复用同一个 4321 preview，零额外构建成本。
            #
            # 13 passed / 1 skipped 是硬断言，不是退出码：`RADIO_LIVE` 默认关闭（真出声
            # 要连外部广播流，CI 不确定），那条用例被 skip 时 Playwright 仍返回 0。
            # 所以既断言 13 passed，也断言 skipped=1 —— 哪天 skip 被误删成实跑（或反过来
            # 全绿但一条没跑），条数会立刻对不上。
            #
            # 注意：13 这个数字随 spec 增长（t_5b6b853d 加了两条 locale 断言 → 11→13）。
            # 加断言是好事，但必须同步改这里，否则门禁红在「条数不对」而不是真实回归上。
            - name: Player e2e · pages-radio 13 (pass 1/2)
              shell: bash
              run: |
                  set -o pipefail
                  corepack pnpm exec playwright test e2e/pages-radio.spec.ts \
                    --reporter=list --retries=0 | tee "$RUNNER_TEMP/pages-radio-1.log"
                  if ! grep -qE "^ +13 passed" "$RUNNER_TEMP/pages-radio-1.log"; then
                    echo "::error::pages-radio 用例数不是 13（RADIO_LIVE 默认关闭时必须是 13 passed / 1 skipped）"
                    tail -40 "$RUNNER_TEMP/pages-radio-1.log"
                    exit 1
                  fi
                  if ! grep -qE "^ +1 skipped" "$RUNNER_TEMP/pages-radio-1.log"; then
                    echo "::error::pages-radio 的 skipped 不是 1 —— 真出声那条不该在 CI 里实跑"
                    tail -40 "$RUNNER_TEMP/pages-radio-1.log"
                    exit 1
                  fi

            - name: Player e2e · pages-radio 13 (pass 2/2 · stability)
              shell: bash
              run: |
                  set -o pipefail
                  corepack pnpm exec playwright test e2e/pages-radio.spec.ts \
                    --reporter=list --retries=0 | tee "$RUNNER_TEMP/pages-radio-2.log"
                  if ! grep -qE "^ +13 passed" "$RUNNER_TEMP/pages-radio-2.log"; then
                    echo "::error::pages-radio 第二遍未全绿（不稳定）"
                    tail -40 "$RUNNER_TEMP/pages-radio-2.log"
                    exit 1
                  fi

            # §5.7.1 视觉基线：已 arm 访客的 idle / expanded / error 三态，元素级
            # 3 形态 × 2 主题 × 2 视口（375/1440）= 12 张。**不重出 42 张页面级基线**：
            # arm-on-play 让未播放访客零节点（dist 全站 0 个 site-player），所以页面级
            # 基线的 42 张里没有播放器，也就不该因为播放器而重出。
            #
            # 三态在运行时造出来（localStorage armed + 路由 abort 流），不需要额外构建，
            # 复用上面那个 preview。同上看条数不看退出码。
            - name: Visual regression · player 12 (pass 1/2)
              shell: bash
              run: |
                  set -o pipefail
                  corepack pnpm exec playwright test e2e/pages-radio.visual.spec.ts \
                    --reporter=list --retries=0 | tee "$RUNNER_TEMP/player-visual-1.log"
                  if ! grep -qE "^ +12 passed" "$RUNNER_TEMP/player-visual-1.log"; then
                    echo "::error::播放器元素基线用例数不是 12（3 形态 × 2 主题 × 2 视口）"
                    tail -40 "$RUNNER_TEMP/player-visual-1.log"
                    exit 1
                  fi

            - name: Visual regression · player 12 (pass 2/2 · stability)
              shell: bash
              run: |
                  set -o pipefail
                  corepack pnpm exec playwright test e2e/pages-radio.visual.spec.ts \
                    --reporter=list --retries=0 | tee "$RUNNER_TEMP/player-visual-2.log"
                  if ! grep -qE "^ +12 passed" "$RUNNER_TEMP/player-visual-2.log"; then
                    echo "::error::播放器元素基线第二遍未全绿（不稳定）"
                    tail -40 "$RUNNER_TEMP/player-visual-2.log"
                    exit 1
                  fi

    # ---- S4 门禁：构建断言 + 内容检查 + 性能预算 ----
    # 和 deploy.yml 的 Build 段保持同一套 env；这里**不部署**，只验门槛。
    gates:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout zcblog
              uses: actions/checkout@v5

            # 外部 fork 的 PR 拿不到 secrets（GitHub 不对 fork 派发 repository secrets），
            # 这步若照常跑会 Authentication failed，整条 CI 红——外部贡献者的 PR 就永远合不了。
            # 因此无 PAT 时跳过：下面的 cp 步骤本来就有 `|| true` 兜底，内容目录会空着，
            # 但 gates job 的判据是契约/门禁而非文章数量，空内容不构成假绿（A2b 空目录判 exit 2）。
            # `secrets` 上下文不能直接用在 `if:` 里（官方硬限制），经 env 中转；step 级 if 可读 env。
            - name: Checkout articles (private)
              if: ${{ env.ARTICLES_PAT != '' }}
              uses: actions/checkout@v5
              continue-on-error: true
              env:
                  ARTICLES_PAT: ${{ secrets.ARTICLES_PAT }}
              with:
                  repository: Smart-Chou/zcblog-articles
                  path: _articles
                  token: ${{ secrets.ARTICLES_PAT }}

            - name: Copy articles and images
              run: |
                  mkdir -p src/content/article src/assets
                  cp _articles/*.md src/content/article/ 2>/dev/null || true
                  cp _articles/*.mdx src/content/article/ 2>/dev/null || true
                  cp -r _articles/assets/* src/assets/ 2>/dev/null || true
                  # 外部 fork 的 PR 拿不到 ARTICLES_PAT，上面三步会全部落空。落空时用仓内
                  # fixture 兜底：否则内容为 0 → EXPECT_ARTICLES=0 → Verify build 的页数断言
                  # 变成"0 等于 0"，是一处彻底的假绿（构建出 0 篇文章也能过）。
                  if [ -z "$(ls src/content/article/*.md src/content/article/*.mdx 2>/dev/null)" ]; then
                    echo "⚠️ 无私有内容仓访问权（外部 PR），改用仓内 fixture 文章"
                    cp -r e2e/fixtures/pages-visual/content/article/*.md src/content/article/ 2>/dev/null || true
                  fi
                  echo "📄 $(ls src/content/article/*.md src/content/article/*.mdx 2>/dev/null | wc -l) 篇文章"
                  echo "🖼  $(find src/assets -type f 2>/dev/null | wc -l) 张图片"

            - name: Normalize frontmatter (v1 布尔键 → v2 features)
              run: node scripts/normalize-frontmatter.mjs src/content/article

            - name: Set expected counts from content
              run: |
                  content=$(ls src/content/article/*.md src/content/article/*.mdx 2>/dev/null | wc -l | tr -d ' ')
                  drafts=$(grep -l '^draft: *true' src/content/article/*.md 2>/dev/null | wc -l | tr -d ' ')
                  echo "内容 ${content} 篇，draft ${drafts} 篇 → 期望产出 $((content - drafts)) 篇"
                  # 内容为 0 时不许继续：EXPECT_ARTICLES=0 会让 Verify build 的页数断言退化成
                  # 「0 等于 0」，构建出空站也算通过——这是假绿，必须硬失败。
                  if [ "$content" -eq 0 ]; then
                    echo "::error::内容目录为空：既没拿到私有仓文章，fixture 兜底也失败。拒绝以 0 篇继续构建。"
                    exit 1
                  fi
                  echo "EXPECT_CONTENT=$content" >> "$GITHUB_ENV"
                  echo "EXPECT_ARTICLES=$((content - drafts))" >> "$GITHUB_ENV"

            - name: Install system dependencies
              run: sudo apt-get update && sudo apt-get install -y libvips-dev

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              env:
                  CI: true
                  ARTICLE_REPO_PATH: _articles
                  BLINKO_API_URL: https://memos.marxchou.com
                  BLINKO_API_TOKEN: ${{ secrets.BLINKO_API_TOKEN }}
                  UMAMI_API_URL: https://umami.marxchou.com
                  UMAMI_WEBSITE_ID: 73b29141-fccf-4d54-9c2f-f7d0d146f86b
                  UMAMI_USERNAME: ${{ secrets.UMAMI_USERNAME }}
                  UMAMI_PASSWORD: ${{ secrets.UMAMI_PASSWORD }}
                  UMAMI_SHARE_SLUG: EIlCDPZqKiANCpuO
                  BANGUMI_USER_ID: "1246668"
                  DOUBAN_USER_ID: ${{ secrets.DOUBAN_USER_ID }}
                  ENCRYPTION_PASSWORD: ${{ secrets.ENCRYPTION_PASSWORD }}
                  FOREVERBLOG_RSS_URL: ${{ secrets.FOREVERBLOG_RSS_URL }}
                  BUILD_CONCURRENCY: 1
              run: pnpm run build

            - name: Verify build (A1 / A11 / A13 + pagefind)
              run: node scripts/verify-build.mjs

            # M1-6：文档页的构建产物检查（D8：7 个 section + 无空表）
            - name: Atom docs gate (dist)
              run: node scripts/gates/verify-atom-docs.mjs --dist

            - name: Content checks (A2 遗留字段 / A3 相对图)
              run: |
                  python3 scripts/gates/check-legacy-keys.py src/content/article
                  # --expect 是「真实内容仓有 22 处相对图引用」这一事实的断言。外部 PR 拿不到
                  # 私有仓、走 fixture 兜底时是 0 处，写死 22 会让每个外部 PR 必红。
                  # 因此只在拿到真实内容（ARTICLES_PAT 存在）时才断言处数；否则仍跑检查
                  # （命中就必须能解析），只是不断言总数。
                  if [ -n "$ARTICLES_PAT" ]; then
                    python3 scripts/gates/check-relative-assets.py src/content/article --verify . --expect 22
                  else
                    echo "⚠️ 外部 PR（无私有仓访问权）：跳过 A3 的处数断言，仍校验可解析性"
                    python3 scripts/gates/check-relative-assets.py src/content/article --verify . || true
                  fi
              env:
                  ARTICLES_PAT: ${{ secrets.ARTICLES_PAT }}

            # P6 / A6 性能预算（列表 / 文章 / 页面）。阈值只有一个来源：
            # scripts/gates/perf-budget.py 的 BUDGET（棘轮只许往下）。
            # 可归因的红灯 / 负向验证在独立 workflow `.github/workflows/perf.yml`；
            # 这里复用刚建好的 dist 再跑一遍，零额外构建成本，当第二道保险。
            - name: Performance budget (A6) · list/article/page
              env:
                  PERF_BUDGET_SCALE: ${{ vars.PERF_BUDGET_SCALE }}
              run: |
                  set -o pipefail
                  python3 scripts/gates/perf-budget.py dist \
                    --json "$RUNNER_TEMP/perf-budget.json" \
                    --summary "$GITHUB_STEP_SUMMARY" | tee "$RUNNER_TEMP/perf-budget.log"

            - name: Upload perf report
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: perf-budget
                  path: |
                      ${{ runner.temp }}/perf-budget.json
                      ${{ runner.temp }}/perf-budget.log
                  retention-days: 7
                  if-no-files-found: ignore
