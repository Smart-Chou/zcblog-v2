name: CI

on:
    push:
        branches: [main, theme]
    pull_request:
        branches: [main, theme]
    # S4：允许手动跑一次完整门禁（不部署），用于验收留证
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "24"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm run lint

            - name: Run TypeScript check
              run: pnpm type-check

            - name: Run unit tests
              run: pnpm test:unit

            # M1-5：DESIGN.md §5.6.13 P1–P10 + 12 个 atom 的落地检查（A1–A8）。
            # M1-6：12 份 atom 文档（D1–D7；D8 需要 dist，在 gates job 里跑）。
            # 纯 node + 仓库内文件，不需要构建、不需要浏览器；本地命令与 CI 完全相同。
            - name: Atom / token gates (§5.6.13)
              run: |
                  node scripts/gates/verify-atoms.mjs
                  node scripts/gates/verify-atom-docs.mjs

            # M2-1：P9 的分母（组件清单）+ R-40 文档漂移。纯 node + 仓库内文件，不需要构建。
            - name: Inventory / doc drift gates (R-40)
              run: |
                  node scripts/gates/verify-component-inventory.mjs
                  node scripts/gates/verify-doc-drift.mjs

    # ---- 契约门禁：token / 表面棘轮 / C 层实体（源码级，不读 dist、不碰内容仓）----
    # 单独成 job 而不是塞进 test：这三条是数据/Tokens 契约，红要能一眼归因；
    # 也不该被 lint 之类的格式漂移挡住（格式债在 test 里单独算）。
    # 三条命令与本地 `pnpm gates:tokens|gates:surfaces|gates:entities` 完全同源。
    contract:
        name: contract (tokens · surfaces · entities)
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "24"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # M1-2：token 契约（G-T1…G-S6，生成物逐字节比对）
            - name: Token contract gates (§3.12)
              run: node scripts/gates/check-tokens.mjs

            # M2-1：P5 表面 token 棘轮（页面新增 = 0 / 组件只减不增）
            - name: Surface token ratchet (P5)
              run: node scripts/gates/verify-surface-tokens.mjs

            # M3-1：包边界（W0 + B1–B4）。判据与三条修复路径见 docs/package-boundary.md。
            # 纯 node + 仓库内文件；packages/ 空壳今天必须 packages=3 violations=0。
            - name: Package boundary gates (M3-1 · B1–B4)
              run: node scripts/gates/verify-package-boundary.mjs

            # M2-7a：C 层实体契约（E1–E8）。依赖 src/types/entities.ts 的 ESM 转译，不读 dist；
            # dropped > 0 即 FAIL（运行时宽容、CI 严格，同一份校验器）。
            # --json 把 SUMMARY {...} 打在最后一行，grep 出来归档到 step summary。
            - name: Entity contract gates (E1–E8)
              run: |
                  set -o pipefail
                  node scripts/gates/verify-entities.mjs --json | tee "$RUNNER_TEMP/entities-gate.json"
                  grep '^SUMMARY ' "$RUNNER_TEMP/entities-gate.json" >> "$GITHUB_STEP_SUMMARY" || true

            - name: Upload entity gate report on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: entities-gate-report
                  path: ${{ runner.temp }}/entities-gate.json
                  retention-days: 7
                  if-no-files-found: ignore

    # ---- 视觉门禁：/design/atoms 72 张 + 页面级 36 张像素基线（Linux）----
    # 与 test/gates 平行跑。四条硬约束：
    #  1. 镜像 tag 必须与 package.json 的 @playwright/test 版本一致（1.63.0），
    #     镜像里的浏览器构建号跟版本绑定，跨版本截图不可比。
    #  2. 基线 e2e/__screenshots__/design-atoms-linux/ 与 pages-linux/ 就是在**这个镜像**里
    #     生成的（`--update-snapshots`），所以判定用 maxDiffPixels: 0，不放大阈值。
    #  3. 不带 --update-snapshots、--retries=0：必须是第一次就过，连跑两遍才算稳定；
    #     重试会把 flake 藏起来。
    #  4. 页面级基线跑在固定内容上（scripts/visual/build-pages-baseline.mjs）：内容仓加一篇
    #     文章不该让视觉门禁红。因此这里**不** checkout 私有文章仓，构建命令也换成该脚本。
    visual:
        name: visual (atoms 72 + pages 36 · linux baselines)
        runs-on: ubuntu-latest
        timeout-minutes: 25
        container:
            image: mcr.microsoft.com/playwright:v1.63.0-noble
            options: --ipc=host
        env:
            # 显式钉平台：基线目录与阈值由 project 决定（见 playwright.config.ts）
            PLAYWRIGHT_BASELINE_PLATFORM: linux

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Enable pnpm (corepack)
              run: corepack enable

            - name: Install dependencies
              run: corepack pnpm install --frozen-lockfile

            # 只构建，不跑 fetch:all：视觉门禁不该被第三方 API 抖动拖红
            # （内容相关的断言在 gates job 里）。文章内容用 e2e/fixtures/pages-visual/
            # 的固定副本，保证首页/归档/文章页在两次运行与两平台之间逐像素一致。
            - name: Build (fixed fixture content · astro preview output)
              run: node scripts/visual/build-pages-baseline.mjs

            # M2-1 / R-41：12 份 atom 文档页 + /design/atoms 的 a11y 与结构门禁。
            # 之前只在本地跑；M2-1 起进 CI，M5-7a 补上「用例数」硬断言：
            # Playwright 对 skip 的用例仍然返回 0，只跑 3 条也会“绿”。所以不看退出码看条数：
            # docs 12 slug × 3 组（structure / axe light+dark / 390px）= 36，atoms 12 → 合计 48。
            # 实测：runner 上 docs 36 条约 12s，本 step 合计约 14s（旧 run 42246582062 证据）。
            - name: Docs a11y · atom docs + atoms (R-41)
              # 容器任务的默认 shell 是 `sh -e`（dash），不认 `set -o pipefail`；
              # 显式用 bash，否则这条 step 在启动第一行就 exit 2。
              shell: bash
              run: |
                  set -o pipefail
                  corepack pnpm exec playwright test \
                    e2e/design-atom-docs.a11y.spec.ts e2e/design-atoms.a11y.spec.ts \
                    --reporter=list --retries=0 | tee "$RUNNER_TEMP/docs-a11y.log"
                  if ! grep -qE "^ +48 passed" "$RUNNER_TEMP/docs-a11y.log"; then
                    echo "::error::docs a11y 用例数不是 48（docs 36 + atoms 12）——被 skip 也算绿，必须看条数"
                    tail -30 "$RUNNER_TEMP/docs-a11y.log"
                    exit 1
                  fi

            - name: Visual regression · atoms 1/2
              run: corepack pnpm exec playwright test e2e/design-atoms.visual.spec.ts --reporter=list --retries=0

            - name: Visual regression · atoms 2/2 (stability)
              run: corepack pnpm exec playwright test e2e/design-atoms.visual.spec.ts --reporter=list --retries=0

            # M5-11 / V-0：6 页 × 3 视口 × 2 主题 = 36。同上看条数，不信退出码。
            - name: Visual regression · pages 36 (pass 1/2)
              shell: bash
              run: |
                  set -o pipefail
                  corepack pnpm exec playwright test e2e/pages.visual.spec.ts \
                    --reporter=list --retries=0 | tee "$RUNNER_TEMP/pages-visual-1.log"
                  if ! grep -qE "^ +36 passed" "$RUNNER_TEMP/pages-visual-1.log"; then
                    echo "::error::页面级视觉基线用例数不是 36（6 页 × 2 主题 × 3 视口）"
                    tail -40 "$RUNNER_TEMP/pages-visual-1.log"
                    exit 1
                  fi

            - name: Visual regression · pages 36 (pass 2/2 · stability)
              shell: bash
              run: |
                  set -o pipefail
                  corepack pnpm exec playwright test e2e/pages.visual.spec.ts \
                    --reporter=list --retries=0 | tee "$RUNNER_TEMP/pages-visual-2.log"
                  if ! grep -qE "^ +36 passed" "$RUNNER_TEMP/pages-visual-2.log"; then
                    echo "::error::页面级视觉基线第二遍未全绿（不稳定）"
                    tail -40 "$RUNNER_TEMP/pages-visual-2.log"
                    exit 1
                  fi

            - name: Upload visual diff on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: visual-diff
                  path: |
                      test-results/
                      playwright-report/
                  retention-days: 7
                  if-no-files-found: ignore

    # ---- S4 门禁：构建断言 + 内容检查 + 性能预算 ----
    # 和 deploy.yml 的 Build 段保持同一套 env；这里**不部署**，只验门槛。
    gates:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout zcblog
              uses: actions/checkout@v5

            - name: Checkout articles (private)
              uses: actions/checkout@v5
              with:
                  repository: Smart-Chou/zcblog-articles
                  path: _articles
                  token: ${{ secrets.ARTICLES_PAT }}

            - name: Copy articles and images
              run: |
                  mkdir -p src/content/article src/assets
                  cp _articles/*.md src/content/article/ 2>/dev/null || true
                  cp _articles/*.mdx src/content/article/ 2>/dev/null || true
                  cp -r _articles/assets/* src/assets/ 2>/dev/null || true
                  echo "📄 $(ls src/content/article/*.md src/content/article/*.mdx 2>/dev/null | wc -l) 篇文章"
                  echo "🖼  $(find src/assets -type f 2>/dev/null | wc -l) 张图片"

            - name: Normalize frontmatter (v1 布尔键 → v2 features)
              run: node scripts/normalize-frontmatter.mjs src/content/article

            - name: Set expected counts from content
              run: |
                  content=$(ls src/content/article/*.md src/content/article/*.mdx 2>/dev/null | wc -l | tr -d ' ')
                  drafts=$(grep -l '^draft: *true' src/content/article/*.md 2>/dev/null | wc -l | tr -d ' ')
                  echo "内容 ${content} 篇，draft ${drafts} 篇 → 期望产出 $((content - drafts)) 篇"
                  echo "EXPECT_CONTENT=$content" >> "$GITHUB_ENV"
                  echo "EXPECT_ARTICLES=$((content - drafts))" >> "$GITHUB_ENV"

            - name: Install system dependencies
              run: sudo apt-get update && sudo apt-get install -y libvips-dev

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              env:
                  CI: true
                  ARTICLE_REPO_PATH: _articles
                  BLINKO_API_URL: https://memos.marxchou.com
                  BLINKO_API_TOKEN: ${{ secrets.BLINKO_API_TOKEN }}
                  UMAMI_API_URL: https://umami.marxchou.com
                  UMAMI_WEBSITE_ID: 73b29141-fccf-4d54-9c2f-f7d0d146f86b
                  UMAMI_USERNAME: ${{ secrets.UMAMI_USERNAME }}
                  UMAMI_PASSWORD: ${{ secrets.UMAMI_PASSWORD }}
                  UMAMI_SHARE_SLUG: EIlCDPZqKiANCpuO
                  BANGUMI_USER_ID: "1246668"
                  DOUBAN_USER_ID: ${{ secrets.DOUBAN_USER_ID }}
                  ENCRYPTION_PASSWORD: ${{ secrets.ENCRYPTION_PASSWORD }}
                  FOREVERBLOG_RSS_URL: ${{ secrets.FOREVERBLOG_RSS_URL }}
                  BUILD_CONCURRENCY: 1
              run: pnpm run build

            - name: Verify build (A1 / A11 / A13 + pagefind)
              run: node scripts/verify-build.mjs

            # M1-6：文档页的构建产物检查（D8：7 个 section + 无空表）
            - name: Atom docs gate (dist)
              run: node scripts/gates/verify-atom-docs.mjs --dist

            - name: Content checks (A2 遗留字段 / A3 相对图)
              run: |
                  python3 scripts/gates/check-legacy-keys.py src/content/article
                  python3 scripts/gates/check-relative-assets.py src/content/article --verify . --expect 22

            # P6 / A6 性能预算（列表 / 文章 / 页面）。阈值只有一个来源：
            # scripts/gates/perf-budget.py 的 BUDGET（棘轮只许往下）。
            # 可归因的红灯 / 负向验证在独立 workflow `.github/workflows/perf.yml`；
            # 这里复用刚建好的 dist 再跑一遍，零额外构建成本，当第二道保险。
            - name: Performance budget (A6) · list/article/page
              env:
                  PERF_BUDGET_SCALE: ${{ vars.PERF_BUDGET_SCALE }}
              run: |
                  set -o pipefail
                  python3 scripts/gates/perf-budget.py dist \
                    --json "$RUNNER_TEMP/perf-budget.json" \
                    --summary "$GITHUB_STEP_SUMMARY" | tee "$RUNNER_TEMP/perf-budget.log"

            - name: Upload perf report
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: perf-budget
                  path: |
                      ${{ runner.temp }}/perf-budget.json
                      ${{ runner.temp }}/perf-budget.log
                  retention-days: 7
                  if-no-files-found: ignore
