name: Deploy

on:
    # D-0175（2026-11-13）：本仓成为生产站，部署目标 = Cloudflare Pages `zcblog-v2`
    # 的 production 环境（https://zcblog-v2.pages.dev）。此前 S6 的「本仓不发生产」
    # 已被 PO 覆盖。
    #
    # 三种触发：
    #   - push main：代码/主题变更即发版（这是「所有更新同步」的主链路）
    #   - repository_dispatch(articles-updated)：文章仓 Smart-Chou/zcblog-articles
    #     推送后自动重建，让新文章进站
    #   - workflow_dispatch：手动补发
    push:
        branches: [main]
    repository_dispatch:
        types: [articles-updated]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    # 生产部署串行：新提交取消旧的在跑部署，避免旧产物最后落地。
    group: deploy-production
    cancel-in-progress: true

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Checkout zcblog
              uses: actions/checkout@v5

            # 外部 fork 的 PR 拿不到 secrets，无 PAT 时跳过（否则 Authentication failed 让 CI 全红）。
            # 内容落空由下面 Copy 步骤的 fixture 兜底。secrets 不能直接进 if，经 env 中转。
            - name: Checkout articles (private)
              if: ${{ env.ARTICLES_PAT != '' }}
              uses: actions/checkout@v5
              continue-on-error: true
              env:
                  ARTICLES_PAT: ${{ secrets.ARTICLES_PAT }}
              with:
                  repository: Smart-Chou/zcblog-articles
                  path: _articles
                  token: ${{ secrets.ARTICLES_PAT }}

            - name: Copy articles and images
              run: |
                  mkdir -p src/content/article
                  cp _articles/*.md src/content/article/ 2>/dev/null || true
                  cp _articles/*.mdx src/content/article/ 2>/dev/null || true
                  echo "📄 $(ls src/content/article/*.md src/content/article/*.mdx 2>/dev/null | wc -l) 篇文章"

                  mkdir -p src/assets
                  cp -r _articles/assets/* src/assets/ 2>/dev/null || true
                  # 无私有仓访问权时（如手动 dispatch 而 PAT 失效）用 fixture 兜底，
                  # 避免以 0 篇文章构建出空站还显示部署成功。
                  if [ -z "$(ls src/content/article/*.md src/content/article/*.mdx 2>/dev/null)" ]; then
                    echo "⚠️ 未拿到私有仓文章，改用仓内 fixture 文章"
                    cp -r e2e/fixtures/pages-visual/content/article/*.md src/content/article/ 2>/dev/null || true
                  fi
                  echo "🖼  $(find src/assets -type f 2>/dev/null | wc -l) 张图片"

            - name: Content contract (A2b 未知字段)
              # 必须在 Normalize 之前跑：normalize 会删掉 v1 的 6 个布尔键，
              # 之后跑就看不见「内容仓写了 v1 旧键」这一类（D-0179）。
              # 判据从 content.config.ts + normalize-frontmatter.mjs 解析，不手抄。
              run: python3 scripts/gates/check-content-contract.py src/content/article

            - name: Normalize frontmatter (v1 布尔键 → v2 features)
              run: node scripts/normalize-frontmatter.mjs src/content/article

            - name: Set expected counts from content
              run: |
                  content=$(ls src/content/article/*.md src/content/article/*.mdx 2>/dev/null | wc -l | tr -d ' ')
                  drafts=$(grep -l '^draft: *true' src/content/article/*.md 2>/dev/null | wc -l | tr -d ' ')
                  echo "内容 ${content} 篇，draft ${drafts} 篇 → 期望产出 $((content - drafts)) 篇"
                  echo "EXPECT_CONTENT=$content" >> "$GITHUB_ENV"
                  echo "EXPECT_ARTICLES=$((content - drafts))" >> "$GITHUB_ENV"

            - name: Install system dependencies
              run: sudo apt-get update && sudo apt-get install -y libvips-dev

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # ---- 源码级门禁：build 之前跑（不读 dist，失败即中断部署）----
            # 与 ci.yml test job 同三条命令；deploy 是手动触发，等于发版前再兜一次。
            - name: Token contract gates (§3.12)
              run: node scripts/gates/check-tokens.mjs

            - name: Surface token ratchet (P5)
              run: node scripts/gates/verify-surface-tokens.mjs

            - name: Entity contract gates (E1–E8)
              run: |
                  set -o pipefail
                  node scripts/gates/verify-entities.mjs --json | tee "$RUNNER_TEMP/entities-gate.json"
                  grep '^SUMMARY ' "$RUNNER_TEMP/entities-gate.json" >> "$GITHUB_STEP_SUMMARY" || true

            - name: Build
              env:
                  CI: true
                  # 生产站是 pages.dev：canonical / sitemap / OG 全靠这个变量，
                  # 不设就会用 src/config/site.ts 的默认值 marxchou.com，
                  # 等于让新站替旧站做 SEO（D-0175 补记）。
                  SITE_URL: https://zcblog-v2.pages.dev
                  ARTICLE_REPO_PATH: _articles
                  BLINKO_API_URL: https://memos.marxchou.com
                  BLINKO_API_TOKEN: ${{ secrets.BLINKO_API_TOKEN }}
                  UMAMI_API_URL: https://umami.marxchou.com
                  UMAMI_WEBSITE_ID: 73b29141-fccf-4d54-9c2f-f7d0d146f86b
                  UMAMI_USERNAME: ${{ secrets.UMAMI_USERNAME }}
                  UMAMI_PASSWORD: ${{ secrets.UMAMI_PASSWORD }}
                  UMAMI_SHARE_SLUG: EIlCDPZqKiANCpuO
                  BANGUMI_USER_ID: "1246668"
                  DOUBAN_USER_ID: ${{ secrets.DOUBAN_USER_ID }}
                  ENCRYPTION_PASSWORD: ${{ secrets.ENCRYPTION_PASSWORD }}
                  FOREVERBLOG_RSS_URL: ${{ secrets.FOREVERBLOG_RSS_URL }}
                  BUILD_CONCURRENCY: 1
              run: pnpm run build

            # ---- S4 门禁：把验收标准变成机器（失败即中断部署）----
            - name: Verify build (A1 / A11 / A13 + pagefind)
              # 生产构建要求 A13 三篇抽样全在：真实内容仓本来都有，缺任何一篇说明
              # 内容链路出问题，不能被「跳过」掩盖（外部 PR 的 fixture 场景才允许跳过）。
              env:
                  A13_REQUIRE_ALL: "1"
              run: node scripts/verify-build.mjs

            - name: Content checks (A2 遗留字段 / A3 相对图)
              run: |
                  python3 scripts/gates/check-legacy-keys.py src/content/article
                  python3 scripts/gates/check-relative-assets.py src/content/article --verify . --expect 22

            - name: Performance budget (A6)
              run: python3 scripts/gates/perf-budget.py dist

            - name: Data freshness (只报告，不阻断)
              # D-0180：fetch-*.mjs 缺变量时静默 exit 0，导致数据陈旧 6 个月无人发现。
              # 本步只把「跳过 / 失败 / 静态 / 陈旧」四类摊开写进 job summary，退出码恒 0。
              # 以 git 提交时间为基准 —— mtime 在 CI 里被 checkout 刷成"刚刚"，不可用。
              if: always()
              run: node scripts/report-data-freshness.mjs

            - name: Lint (prettier --check)
              run: pnpm run lint

            # 部署到 Cloudflare Pages production（D-0175）
            # `--branch main` = 更新 production 环境（zcblog-v2.pages.dev）；
            # 其它分支名是 preview。与 demo.yml 的 `--branch demo` 互不干扰。
            - name: Deploy to Cloudflare Pages (production)
              id: pages_deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: 06096af32bcdfc655f5076b224b32c00
              run: |
                  if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
                    echo "::error::未配置 secrets.CF_PAGES_TOKEN，无法部署生产"
                    exit 1
                  fi
                  npx --yes wrangler@4.158.0 pages deploy dist \
                    --project-name zcblog-v2 --branch main --commit-dirty=true \
                    2>&1 | tee "$RUNNER_TEMP/pages-deploy.log"
                  url=$(grep -oE 'https://[a-z0-9]+\.zcblog-v2\.pages\.dev' "$RUNNER_TEMP/pages-deploy.log" | tail -1)
                  echo "deployment_url=$url" >> "$GITHUB_OUTPUT"

            # SEO 主动推送（IndexNow + 可选百度）：部署完成后提交新/更新文章 URL；
            # 未配置 INDEXNOW_KEY / BAIDU_TOKEN 时脚本自动跳过；失败不影响部署
            - name: Submit to IndexNow
              env:
                  INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
                  BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}
                  SITE_URL: https://zcblog-v2.pages.dev
              run: node scripts/indexnow-submit.mjs || echo "⚠️ IndexNow 提交失败（不影响部署）"

            # 注意：这里**不**做 Cloudflare cache purge。CF_ZONE_ID 指向的是
            # marxchou.com 那个 zone，purge 它与 pages.dev 无关（pages.dev 每个部署
            # 都是独立指针，切换即生效）。marxchou.com 自己那条流水线仍会 purge。

            - name: Deployment summary
              if: always()
              run: |
                  {
                    echo "### Production deploy"
                    echo ""
                    echo "- 站点：https://zcblog-v2.pages.dev"
                    echo "- 部署：${{ steps.pages_deploy.outputs.deployment_url || '（未产生 URL，见日志）' }}"
                    echo "- 触发：${{ github.event_name }}${{ github.event.action && format(' ({0})', github.event.action) || '' }}"
                  } >> "$GITHUB_STEP_SUMMARY"
