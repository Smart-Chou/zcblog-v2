name: Friend Link

# 友链申请自动化：
#   opened            → 自动检查（可达性 / 反链）并回评
#   labeled(approved) → 自动合并到 src/data/friends.json 并触发部署
on:
    issues:
        types: [opened, labeled]

permissions:
    contents: write
    issues: write
    # 本 workflow 现在走 PR + auto-merge，需要开 PR 的权限；
    # 缺这条会报 GraphQL: Resource not accessible by integration (createPullRequest)。
    pull-requests: write

concurrency:
    group: friend-link-${{ github.event.issue.number }}
    cancel-in-progress: false

jobs:
    validate:
        if: >-
            github.event.action == 'opened' &&
            contains(github.event.issue.labels.*.name, 'friend-link')
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Validate submission and comment
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  ISSUE_NUMBER: ${{ github.event.issue.number }}
                  ISSUE_BODY: ${{ github.event.issue.body }}
              run: node .github/scripts/friend-link.mjs validate

    merge:
        if: >-
            github.event.action == 'labeled' &&
            github.event.label.name == 'approved' &&
            contains(github.event.issue.labels.*.name, 'friend-link')
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: main

            - name: Merge approved submission
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  ISSUE_NUMBER: ${{ github.event.issue.number }}
                  ISSUE_BODY: ${{ github.event.issue.body }}
              run: node .github/scripts/friend-link.mjs merge

            - name: Open PR for manual merge
              env:
                  GH_TOKEN: ${{ github.token }}
                  ISSUE: ${{ github.event.issue.number }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  if git diff --quiet -- src/data/friends.json; then
                      echo "friends.json 无变化，跳过提交（可能为重复申请）"
                      exit 0
                  fi

                  # 走 PR 而非直推 main：main 有分支保护，GITHUB_TOKEN 直推会被
                  # `protected branch hook declined` 拒绝（已实测）。
                  BRANCH="friend-link/issue-${ISSUE}"
                  git checkout -b "$BRANCH"
                  git add src/data/friends.json
                  git commit -m "chore: add friend link (issue #${ISSUE})"
                  git push -u origin "$BRANCH"

                  # ⚠️ 为什么不用 --auto 自动合并（实测结论，勿改回去）：
                  # GITHUB_TOKEN 创建的 PR 不会触发 pull_request workflow（GitHub 防递归）。
                  # 必需检查因此永远不上报，--auto 会卡在 "Waiting for status to be reported"。
                  # close+reopen 也绕不过——实测同样 0 个 check-runs。
                  # 所以只能开 PR 等人工合并；合并时 `Closes` 会自动关 issue。
                  PR_URL=$(gh pr create --base main --head "$BRANCH" \
                    --title "chore: add friend link (issue #${ISSUE})" \
                    --body "自动生成的友链更新，来自 #${ISSUE}。

                  **请站长手动合并**：这个 PR 由 \`GITHUB_TOKEN\` 创建，按 GitHub 的防递归机制
                  不会触发 \`pull_request\` 检查，因此无法走 auto-merge（会一直等检查上报）。
                  合并前请自行确认 \`friends.json\` 的 diff 只多了这一条。

                  Closes #${ISSUE}" | tail -1)
                  echo "已创建 $PR_URL"
