packages:
    - "packages/*"

allowBuilds:
    esbuild: true
    sharp: true

minimumReleaseAgeExclude:
    - "@expressive-code/core@0.44.0"
    - "@expressive-code/plugin-frames@0.44.0"
    - "@expressive-code/plugin-shiki@0.44.0"
    - "@expressive-code/plugin-text-markers@0.44.0"
    - astro-expressive-code@0.44.0
    - expressive-code@0.44.0
    - rehype-expressive-code@0.44.0

overrides:
    yaml: ">=2.8.3"
    source-map-js: ">=1.2.2"
    postcss-selector-parser: ">=7.1.6"
    katex: "^0.19.0"
    http-cache-semantics: ">=4.3.0"
    # satori 全系精确钉 fflate@0.7.3（GHSA-px8p-9vwx-vf98，<0.7.5）。
    # 只对 satori 的子依赖覆写到同 minor 的 0.7.5；不要写全局 `fflate`，
    # 否则会把 @iconify/tools 要求的 ^0.8.3 错误降级。
    satori>fflate: "^0.7.5"
